services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: cerevia-falkordb
    ports:
      # Configurable: a local Redis on 6379 answers but has no graph module.
      - "${FALKORDB_PORT:-6379}:6379"
      # Browser UI, kept off 3000 (the frontend dev server).
      - "${FALKORDB_UI_PORT:-3100}:3000"
    environment:
      # --requirepass only when a password is set; an empty one stops Redis starting.
      REDIS_ARGS: "--appendonly yes${FALKORDB_PASSWORD:+ --requirepass }${FALKORDB_PASSWORD}"
    volumes:
      # FalkorDB's real data directory; /data only holds a symlink to it.
      - falkordb_data:/var/lib/falkordb/data
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: cerevia-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cerevia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cerevia}
      POSTGRES_DB: ${POSTGRES_DB:-cerevia}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # Separate Redis for BullMQ so queue persistence settings do not conflict
  # with FalkorDB's Redis-protocol server on 6379.
  redis:
    image: redis:7-alpine
    container_name: cerevia-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # Object storage is a filesystem backend in dev (`.data/uploads`); the S3
  # backend is available via STORAGE_BACKEND=s3 for real deployments. MinIO and
  # LocalStack both ended free distribution in 2025–2026.

volumes:
  falkordb_data:
  postgres_data:
  redis_data:
